[Source]

# ------------------------------------------------------------------------------
# Image source
#   webcam: Live capture from webcam. Needs `camera_id` set.
#   Ximea : Live capture from Ximea camera. Needs `camera_id` set.
image_source = ximea

# ------------------------------------------------------------------------------
# Id of the camera to connect to in case of `image_source = webcam | Ximea`. If
# only one camera is attached the id will be 0.
camera_id = 0

# ------------------------------------------------------------------------------
# Wanted resolution in case of `image_source = webcam | Ximea`. Not garantueed
# you will obtain it.
# Common options:
#   [1280, 720]   # 16:9  0.9 MPx
#   [1024, 1024]  # 1:1   1.0 MPx
#   [1600, 896]   # 16:9  1.4 MPx
#   [1920, 1080]  # 16:9  2.1 MPx
wanted_resolution = [1280, 720]
